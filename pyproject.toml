[project]
name = "energy-data-hub"
version = "0.1.0"
description = "Shared energy data ingestion hub (Dagster) for the research/ energy projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edh", "edh_dagster"]

[tool.dagster]
module_name = "edh_dagster.definitions"
